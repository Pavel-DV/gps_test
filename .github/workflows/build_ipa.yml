name: Build Location IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Test remote connection validation and diagnostics
        run: |
          mkdir -p build
          MACOSX_DEPLOYMENT_TARGET=14.0 swiftc -parse-as-library \
            StikDebug/Device/DeviceConnectionContext.swift \
            StikDebug/Services/ConnectionDiagnostics.swift \
            StikDebug/Support/PairingFileFormat.swift \
            Tests/RemoteConnectionTests.swift \
            -o build/remote-connection-tests
          build/remote-connection-tests
      - name: Build unsigned archive
        run: |
          xcodebuild clean archive \
            -project StikDebug.xcodeproj \
            -scheme StikDebug \
            -configuration Release \
            -archivePath build/StikDebug.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/StikDebug.xcarchive/Products/Applications/StikDebug.app build/Payload/
          cd build
          zip -qr StikDebug.ipa Payload
          unzip -t StikDebug.ipa
      - uses: actions/upload-artifact@v7
        with:
          path: build/StikDebug.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14
